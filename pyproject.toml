[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subaiagents-tool"
version = "0.1.0"
description = "MCP server giving Claude Code strong ADB control and a ChatGPT coding sub-agent to reduce token usage."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "openai>=1.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
subaiagents = "subaiagents.server:main"

[tool.setuptools.packages.find]
where = ["src"]
